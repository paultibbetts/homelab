---
- block:
  - name: Download Kubernetes YAML manifests
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ version }}/manifests/install.yaml"
      dest: /tmp/argocd_install.yaml
  - name: Install Kubernetes YAML manifests
    kubernetes.core.k8s:
      state: present
      src: /tmp/argocd_install.yaml
      namespace: "{{ argocd_namespace }}"
  always:
    - name: Cleanup
      file:
        path: /tmp/argocd_install.yaml
        state: absent
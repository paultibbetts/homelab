apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: truenas-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s

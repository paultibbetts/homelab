apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: truenas-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-exporter
        app.kubernetes.io/component: exporter
        app.kubernetes.io/part-of: truenas-monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/paultibbetts/truenas-scale-api-prometheus-exporter:ci-publish-multiarch-container-images
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          env:
            - name: TRUENAS_WS_URL
              value: wss://nas.infra.home.arpa/api/current
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenas-exporter-api
                  key: api-key
            - name: TRUENAS_VERIFY_TLS
              value: "true"
            - name: EXPORTER_PORT
              value: "9108"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "60"
            - name: TRUENAS_TIMEOUT_SECONDS
              value: "20"
            - name: LOG_LEVEL
              value: INFO
            - name: ENABLE_DATASET_METRICS
              value: "true"
            - name: ENABLE_IPMI_METRICS
              value: "true"
            - name: ENABLE_EVENT_STREAMS
              value: "true"
            - name: ENABLE_GENERIC_METHOD_METRICS
              value: "false"
            - name: ENABLE_GENERIC_EVENT_METRICS
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

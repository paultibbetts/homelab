traefik:
  deployment:
    dnsConfig:
      nameservers:
        - 192.168.1.2
      searches:
        - lan
    replicas: 3
  ports:
    web:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    websecure:
      http3:
        enabled: true
  global:
    checkNewVersion: false
  additionalArguments:
    - "--serversTransport.insecureSkipVerify=true"
    - "--log.level=INFO"
  ingressRoute:
    dashboard:
      enabled: true
  providers:
    kubernetesCRD:
      enabled: true
      allowExternalNameServices: true
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: true
      publishedService:
        enabled: true
  service:
    enabled: true
    type: LoadBalancer
    annotations: {}
    labels: {}
    spec:
      loadBalancerIP: 192.168.1.252 # this should be an IP in the MetalLB range
    loadBalancerSourceRanges: []
    externalIPs: []

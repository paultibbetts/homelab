traefik:
  globalArguments:
    - "--global.checknewversion=false"
  additionalArguments:
    - "--serversTransport.insecureSkipVerify=true"
    - "--log.level=INFO"
  deployment:
    enabled: true
    replicas: 3
    annotations: {}
    podAnnotations: {}
    additionalContainers: []
    initContainers: []
    ingressRoute:
      dashboard:
        enabled: true
  ports:
    web:
      redirectTo:
        port: websecure
        priority: 10
      websecure:
        http3:
          enabled: true
        advertisedPort: 4443
        tls:
          enabled: true
  ingressRoute:
    dashboard:
      enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: true
  rbac:
    enabled: true
  service:
    enabled: true
    type: LoadBalancer
    annotations: {}
    labels: {}
    spec:
      loadBalancerIP: 192.168.1.252 # this should be an IP in the MetalLB range
    loadBalancerSourceRanges: []
    externalIPs: []

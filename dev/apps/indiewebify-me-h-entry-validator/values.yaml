web-app:
  replicaCount: 1
  image:
    value: gitea.cloud.paultibbetts.uk/paul/indiewebify-me:feat-h-entry-validator-e9c826e60c4f
    pullPolicy: IfNotPresent
  containerPort: 80
  env:
    - name: APP_ENV
      value: production
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  ingress:
    enabled: true
    className: traefik
    annotations:
      external-dns.alpha.kubernetes.io/target: traefik.lab.paultibbetts.uk
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: indiewebify-me-h-entry-validator.dev.lab.paultibbetts.uk
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

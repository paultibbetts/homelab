apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-previews
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://gitea.cloud.paultibbetts.uk/paul/homelab.git
        revision: main
        files:
          - path: dev/previews/*.yaml
  template:
    metadata:
      name: 'preview-{{ .name }}'
      labels:
        stack: dev
        dev.paultibbetts.uk/type: preview
        dev.paultibbetts.uk/preset: '{{ .preset }}'
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    spec:
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      project: dev
      source:
        repoURL: https://gitea.cloud.paultibbetts.uk/paul/homelab.git
        path: '{{ if eq .preset "web-app" }}charts/web-app{{ else }}{{ .sourcePath }}{{ end }}'
        targetRevision: main
        helm:
          values: |
            {{ if eq .preset "web-app" }}
            ingress:
              enabled: true
              className: traefik
              annotations:
                external-dns.alpha.kubernetes.io/target: traefik.lab.paultibbetts.uk
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: {{ .host }}
                  paths:
                    - path: /
                      pathType: Prefix
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            {{ end }}
            {{ .helmValues }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 1m
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true

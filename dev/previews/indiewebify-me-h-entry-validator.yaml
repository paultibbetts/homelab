name: indiewebify-me-h-entry-validator
namespace: preview-indiewebify-me-h-entry-validator
preset: web-app
host: indiewebify-me-h-entry-validator.preview.lab.paultibbetts.uk
helmValues: |
  replicaCount: 1
  image:
    value: gitea.cloud.paultibbetts.uk/paul/indiewebify-me:feat-h-entry-validator-d7e7fcc91d51
    pullPolicy: IfNotPresent
  containerPort: 80
  env:
    - name: APP_ENV
      value: production
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-dashboard
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: "traefik.lab.paultibbetts.uk"
    gethomepage.dev/href: "https://argocd.lab.paultibbetts.uk"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: ArgoCD dashboard
    gethomepage.dev/group: Admin
    gethomepage.dev/icon: argocd.png
    gethomepage.dev/name: ArgoCD
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.lab.paultibbetts.uk`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
    - match: Host(`argocd.lab.paultibbetts.uk`) && Header(`Content-Type`, `application/grpc`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls

argo-cd:
  configs:
    cm:
      create: true
      oidc.config: |
        name: Kanidm
        issuer: https://auth.lab.paultibbetts.uk/oauth2/openid/argocd
        clientID: argocd
        clientSecret: $argocd-sso-secret:oidc.clientSecret
        requestedIDTokenClaims:
          groups:
            essential: true
        requestedScopes:
          - openid
          - profile
          - email
        enablePKCEAuthentication: false
        enableUserInfoGroups: true
        userInfoPath: /userinfo
        userInfoCacheExpiration: "5m"
      rbac:
        create: true
        annotations: {}
        policy.default: ''
        policy.csv: ''
        # Policy rules are in the form:
        #  p, subject, resource, action, object, effect
        # Role definitions and bindings are in the form:
        #  g, subject, inherited-subject
        policy.csv: |
          p, role:org-admin, applications, *, */*, allow
          p, role:org-admin, clusters, get, *, allow
          p, role:org-admin, repositories, *, *, allow
          p, role:org-admin, logs, get, *, allow
          p, role:org-admin, exec, create, */*, allow
          g, argocd-orgadmins, role:org-admin

        # -- OIDC scopes to examine during rbac enforcement (in addition to `sub` scope).
        # The scope value can be a string, or a list of strings.
        scopes: "[groups]"

        # -- Matcher function for Casbin, `glob` for glob matcher and `regex` for regex matcher.
        policy.matchMode: "glob"
  server:
    extraArgs:
      - --insecure
    config:
      statusbadge.enabled: 'true'
    ingress:
      enabled: false
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: false
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
  global:
    domain: argocd.lab.paultibbetts.uk
  certificate:
    enabled: true

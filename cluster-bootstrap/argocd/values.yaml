argo-cd:
  server:
    extraArgs:
      - --insecure
    config:
      statusbadge.enabled: 'true'
    ingress:
      enabled: false
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: false
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
  global:
    domain: argocd.lab.paultibbetts.uk
  certificate:
    enabled: true

argo-cd:
  configs:
    cm:
      create: true
      oidc.config: |
        name: Kanidm
        issuer: https://auth.lab.paultibbetts.uk/oauth2/openid/argocd
        clientID: argocd
        clientSecret: $argocd-sso-secret:oidc.clientSecret
        requestedIDTokenClaims:
          groups:
            essential: true
        requestedScopes:
          - openid
          - profile
          - email
  server:
    extraArgs:
      - --insecure
    config:
      statusbadge.enabled: 'true'
    ingress:
      enabled: false
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: false
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
  global:
    domain: argocd.lab.paultibbetts.uk
  certificate:
    enabled: true

apiVersion: v1
kind: PersistentVolume
metadata:
  name: kiwix-data
  labels:
    app: kiwix
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.1.21.4
    path: /mnt/hdd-storage/knowledge/kiwix
    readOnly: true

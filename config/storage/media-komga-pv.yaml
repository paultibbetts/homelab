apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-komga
  labels:
    app: komga
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.4
    path: /mnt/nvme-storage/media
    readOnly: true

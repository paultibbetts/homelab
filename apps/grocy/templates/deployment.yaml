apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy
  labels:
    app.kubernetes.io/name: grocy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grocy
          image: lscr.io/linuxserver/grocy:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/London
            - name: GROCY_CURRENCY
              value: GBP
            - name: GROCY_CALENDAR_FIRST_DAY_OF_WEEK
              value: "1"
            - name: GROCY_ENERGY_UNIT
              value: kcal
            - name: GROCY_FEATURE_FLAG_EQUIPMENT
              value: "false"
            - name: GROCY_FEATURE_FLAG_RECIPES
              value: "false"
            - name: GROCY_FEATURE_FLAG_RECIPES_MEALPLAN
              value: "false"
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config

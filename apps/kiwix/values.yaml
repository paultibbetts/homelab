kiwix:
  image:
    repository: ghcr.io/kiwix/kiwix-serve
    tag: 3.8.2
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

dataPersistence:
  enabled: true
  claimName: kiwix-data
  size: 1Ti
  volumeName: kiwix-data

ingressRoute:
  host: kiwix.lab.paultibbetts.uk
  externalDnsTarget: traefik.lab.paultibbetts.uk

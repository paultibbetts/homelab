apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/component: postgres
spec:
  serviceName: penpot-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: penpot
            - name: POSTGRES_USER
              value: penpot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: penpot-postgres

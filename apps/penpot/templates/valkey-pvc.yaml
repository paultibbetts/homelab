apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/component: valkey
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/component: valkey
spec:
  serviceName: penpot-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: penpot-valkey

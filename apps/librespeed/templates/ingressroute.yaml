apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: librespeed
  namespace: librespeed
  annotations:
    external-dns.alpha.kubernetes.io/target: "traefik.lab.paultibbetts.uk"
    gethomepage.dev/href: "https://librespeed.lab.paultibbetts.uk"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Speed test
    # gethomepage.dev/group: Media
    gethomepage.dev/icon: librespeed.png
    gethomepage.dev/name: Librespeed
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`librespeed.lab.paultibbetts.uk`)
      kind: Rule
      services:
        - name: librespeed
          port: http
  tls:
    secretName: librespeed-tls


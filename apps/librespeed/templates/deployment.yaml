---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: librespeed
  name: librespeed
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: librespeed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librespeed
    spec:
      containers:
        - name: librespeed
          image: ghcr.io/librespeed/speedtest@sha256:f17410ec8819a42f09fdc677c473fd033197a79a37ce7340766c8b77cdca4399
          env:
            - name: MODE
              value: standalone

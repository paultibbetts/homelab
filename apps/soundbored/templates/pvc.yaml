apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soundbored-uploads
  namespace: soundbored
  labels:
    app.kubernetes.io/name: soundbored
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soundbored-database
  namespace: soundbored
  labels:
    app.kubernetes.io/name: soundbored
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

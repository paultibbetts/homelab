apiVersion: apps/v1
kind: Deployment
metadata:
  name: soundbored
  namespace: soundbored
  labels:
    app.kubernetes.io/name: soundbored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: soundbored
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soundbored
    spec:
      containers:
        - name: soundbored
          image: christom/soundbored:d0a869ce46a9d9217852c6087464d021f6685011
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: DISCORD_TOKEN
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: DISCORD_CLIENT_SECRET
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: SECRET_KEY_BASE
            - name: DISCORD_REQUIRED_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: DISCORD_REQUIRED_GUILD_ID
            - name: DISCORD_REQUIRED_ROLE_IDS
              valueFrom:
                secretKeyRef:
                  name: soundbored-env
                  key: DISCORD_REQUIRED_ROLE_IDS
            - name: PHX_HOST
              value: soundbored.lab.paultibbetts.uk
            - name: SCHEME
              value: https
            - name: BIND_IP
              value: 0.0.0.0
            - name: AUTO_JOIN
              value: play
            - name: VOICE_IDLE_TIMEOUT_SECONDS
              value: "600"
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/priv/static/uploads
            - name: database
              mountPath: /app/priv/db
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: soundbored-uploads
        - name: database
          persistentVolumeClaim:
            claimName: soundbored-database

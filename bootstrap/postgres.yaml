---
- hosts: postgres
  gather_facts: true
  become: yes
  pre_tasks:
    - name: Update repositories cache
      ansible.builtin.apt:
        update_cache: yes
  roles:
    - role: geerlingguy.postgresql
      tags:
        - postgres
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-postgres.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"
    backup_directory: /var/backups/postgres-dumps
    healthcheck: "curl -fsS -m 10 --retry 5 -o /dev/null https://healthchecks.lab.paultibbetts.uk/ping/6f1e1946-5244-4816-b857-96c82c964a3f"

  tasks:
    - name: Backup
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: "{{ backup_directory }}"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: "backups/{{ backup_script_name }}"
            dest: "{{ backup_script }}"
        - name: Make script executable
          ansible.builtin.file:
            path: "{{ backup_script }}"
            mode: "0755"
        - name: Add script to CRON
          ansible.builtin.cron:
            name: postgres backup
            hour: "2"
            minute: "0"
            job: "{{ backup_script }} && {{ healthcheck }}"

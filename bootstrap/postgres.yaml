---
- hosts: postgres
  gather_facts: true
  become: yes
  pre_tasks:
    - name: Update repositories cache
      ansible.builtin.apt:
        update_cache: yes
  roles:
    - role: geerlingguy.postgresql
      tags:
        - postgres
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-postgres.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"

  tasks:
    - name: Backup
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: /var/backups/postgres-dumps
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: backups/backup-postgres.sh
            dest: "{{ backup_script }}"
        - name: Make script executable
          ansible.builtin.file:
            path: "{{ backup_script }}"
            mode: "0755"
        - name: Add script to CRON
          ansible.builtin.cron:
            name: postgres backup
            hour: 4
            job: "{{ backup_script }}"

---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - app_path is defined
      - app_path | length > 0
    fail_msg: "You must set app_path when including docker_compose_app."

- name: Determine source role path
  ansible.builtin.set_fact:
    docker_compose_app_src_role_path: >-
      {{ src_role_path | default((ansible_parent_role_paths | default([''])) | first, true) }}

- name: Ensure source role path is available
  ansible.builtin.assert:
    that:
      - docker_compose_app_src_role_path is defined
      - docker_compose_app_src_role_path | length > 0
    fail_msg: "docker_compose_app could not determine the calling role's path. Pass src_role_path: '{{ '{{ role_path }}' }}'."

- name: Derive local source paths
  ansible.builtin.set_fact:
    docker_compose_app_files_root: "{{ docker_compose_app_src_role_path.rstrip('/') }}/files"
    docker_compose_app_templates_root: "{{ docker_compose_app_src_role_path.rstrip('/') }}/templates"
    docker_compose_app_compose_src: "{{ compose_src | default(docker_compose_app_src_role_path.rstrip('/') ~ '/files/docker-compose.yaml') }}"
    docker_compose_app_env_template: "{{ env_template | default(docker_compose_app_src_role_path.rstrip('/') ~ '/templates/.env.j2', true) }}"

- name: Ensure app dir
  ansible.builtin.file:
    path: "{{ app_path }}"
    state: directory
    mode: "0755"

- name: Copy docker-compose.yaml
  ansible.builtin.copy:
    src: "{{ docker_compose_app_compose_src }}"
    dest: "{{ app_path }}/docker-compose.yaml"
    mode: "0644"

- name: Check for env template
  ansible.builtin.stat:
    path: "{{ docker_compose_app_env_template }}"
  register: docker_compose_env_template_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_compose_app_env_template is defined

- name: Render .env from template (vaulted secrets)
  ansible.builtin.template:
    src: "{{ docker_compose_app_env_template }}"
    dest: "{{ app_path }}/.env"
    mode: "0600"
  when:
    - docker_compose_env_template_stat is defined
    - docker_compose_env_template_stat.stat.exists

- name: Check asset directories
  ansible.builtin.stat:
    path: "{{ docker_compose_app_files_root }}/{{ dir }}"
  register: asset_dir_stats
  loop: "{{ app_asset_dirs }}"
  loop_control:
    loop_var: dir
    label: "{{ dir }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy asset directories
  ansible.builtin.copy:
    src: "{{ docker_compose_app_files_root }}/{{ dir }}/"
    dest: "{{ app_path }}/{{ dir }}/"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ asset_dir_stats.results | selectattr('stat.exists') | map(attribute='dir') | list }}"
  loop_control:
    loop_var: dir
    label: "{{ dir }}"

- name: Check asset files
  ansible.builtin.stat:
    path: "{{ docker_compose_app_files_root }}/{{ f }}"
  register: asset_file_stats
  loop: "{{ app_asset_files }}"
  loop_control:
    loop_var: f
    label: "{{ f }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy asset files
  ansible.builtin.copy:
    src: "{{ docker_compose_app_files_root }}/{{ f }}"
    dest: "{{ app_path }}/{{ f }}"
    mode: "0644"
  loop: "{{ asset_file_stats.results | selectattr('stat.exists') | map(attribute='f') | list }}"
  loop_control:
    loop_var: f
    label: "{{ f }}"

- name: Docker compose down (optional)
  ansible.builtin.command: docker compose down
  args: { chdir: "{{ app_path }}" }
  become: true
  when:
    - down_before_up | default(false)
    - not ansible_check_mode

- name: Docker compose up -d
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
    project_name: "{{ app_name | default(omit) }}"
    remove_orphans: true
  become: true
  when: not ansible_check_mode

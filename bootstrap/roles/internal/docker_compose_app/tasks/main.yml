---
- name: docker_compose_app deprecation notice
  ansible.builtin.debug:
    msg: >-
      docker_compose_app is deprecated. Include roles/internal/common/tasks/deploy_compose_app.yml
      directly with explicit app_name, app_path, and compose_src instead.
  when: docker_compose_app_deprecation_notice | default(true)

- name: Deploy docker compose app (deprecated wrapper)
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/deploy_compose_app.yml"

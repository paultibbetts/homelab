---
- name: DDNS
  block:
    - name: Install requirements
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Template script
      ansible.builtin.template:
        src: duck.sh.j2
        dest: "{{ ddns_script }}"
        mode: "0700"

    - name: Add script to CRON
      ansible.builtin.cron:
        name: ddns
        minute: "5"
        job: "{{ ddns_script }}"

---
- name: "{{ app_name }}: Validate required variables"
  ansible.builtin.assert:
    that:
      - app_name | default('') | length > 0
      - app_path | default('') | length > 0
      - compose_src | default('') | length > 0
    fail_msg: "You must set app_name, app_path, and compose_src when including deploy_compose_app."

- name: "{{ app_name }}: Deploy compose app"
  vars:
    compose_app_user: "{{ app_user | default(ops_user | default(ansible_facts['user_id'])) }}"
    compose_app_group: "{{ app_group | default(app_user | default(ops_user | default(ansible_facts['user_id']))) }}"
    compose_app_become_fs: "{{ app_path is match('^/srv/') }}"
    compose_app_volume_paths: >-
      {{ volume_dirs | default([]) | map('regex_replace', '^(?!/)', app_path ~ '/') | list }}
  block:
    - name: "{{ app_name }}: Ensure app directory and volume roots"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0755"
      loop: "{{ [app_path] + compose_app_volume_paths }}"

    - name: "{{ app_name }}: Copy docker-compose.yaml"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ app_path }}/docker-compose.yaml"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0644"

    - name: "{{ app_name }}: Render .env from template"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.template:
        src: "{{ env_template }}"
        dest: "{{ app_path }}/.env"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0600"
      when:
        - env_template is defined
        - env_template != omit

    - name: "{{ app_name }}: Docker compose up -d"
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        project_name: "{{ app_name }}"
        remove_orphans: true
      when: not ansible_check_mode

    - name: "{{ app_name }}: Enforce ownership on volume roots (post-compose)"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        recurse: true
      loop: "{{ compose_app_volume_paths }}"
      when:
        - not ansible_check_mode
        - enforce_volume_ownership | default(false)
        - compose_app_volume_paths | length > 0

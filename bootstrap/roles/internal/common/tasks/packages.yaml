---
- name: Ensure baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Ensure python3-debian is installed - needed for Ansible check mode on Debian
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

---
- name: Ensure Kanidm app directory
  ansible.builtin.file:
    path: "{{ kanidm_app_path }}"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: Ensure Kanidm data directory
  ansible.builtin.file:
    path: "{{ kanidm_app_path }}/data"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: Generate Kanidm self-signed certificate bundle
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:4096
      -keyout {{ kanidm_tls_key_path }}
      -out {{ kanidm_tls_chain_path }}
      -days {{ kanidm_tls_validity_days }}
      -subj /CN={{ kanidm_domain }}
      {% if kanidm_tls_subject_alt_names %}
      -addext subjectAltName={{ kanidm_tls_subject_alt_names | join(',') }}
      {% endif %}
    creates: "{{ kanidm_tls_chain_path }}"
  when:
    - not ansible_check_mode
    - kanidm_tls_generate | bool

- name: Ensure Kanidm TLS file permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kanidm_tls_key_path }}", mode: "0600" }
    - { path: "{{ kanidm_tls_chain_path }}", mode: "0644" }
  when:
    - not ansible_check_mode
    - kanidm_tls_generate | bool

- name: Deploy Kanidm server configuration
  ansible.builtin.template:
    src: server.toml.j2
    dest: "{{ kanidm_app_path }}/data/server.toml"
    mode: "0640"
  when: not ansible_check_mode

- name: Deploy {{ kanidm_app_name }}
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/deploy_compose_app.yml"
  vars:
    app_name: "{{ kanidm_app_name }}"
    app_path: "{{ kanidm_app_path }}"
    compose_src: "{{ role_path }}/files/docker-compose.yaml"
    env_template: "{{ role_path }}/templates/.env.j2"
    volume_dirs:
      - data
  when: not ansible_check_mode

- name: Kanidm check mode reminder
  ansible.builtin.debug:
    msg: >
      Kanidm role skipped runtime changes in check mode. Apply without --check to create directories,
      generate TLS assets, render server.toml, and manage the docker compose deployment.
  when: ansible_check_mode

---
- name: Deploy {{ uptime_kuma_app_name }}
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/deploy_compose_app.yml"
  vars:
    app_name: "{{ uptime_kuma_app_name }}"
    app_path: "{{ uptime_kuma_app_path }}"
    compose_src: "{{ role_path }}/files/docker-compose.yaml"
    volume_dirs:
      - uptime-kuma-data
    enforce_volume_ownership: "{{ uptime_kuma_enforce_volume_ownership }}"
  when: not ansible_check_mode

- name: Uptime Kuma check mode reminder
  ansible.builtin.debug:
    msg: >
      Uptime Kuma role skipped runtime changes in check mode. Apply without --check to stage assets
      and manage the docker compose deployment.
  when: ansible_check_mode

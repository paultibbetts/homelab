---
- name: Validate MaxMind credentials for Pangolin
  ansible.builtin.assert:
    that:
      - pangolin_maxmind_account_id | string | length > 0
      - pangolin_maxmind_license_key | string | length > 0
    fail_msg: >
      MaxMind credentials are required when geoblocking is enabled.
      Set pangolin_maxmind_account_id and pangolin_maxmind_license_key.
  when: pangolin_enable_geoblocking | bool
  no_log: true

- name: Render Pangolin env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pangolin_env_file_path }}"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_secret_file_mode }}"
  when: pangolin_manage_env_file | bool
  notify: pangolin_compose_changed
  no_log: true

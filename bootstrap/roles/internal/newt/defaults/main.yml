---
newt_repo: "fosrl/newt"
newt_version: "1.8.0"

newt_bin_path: "/usr/local/bin/newt"
newt_wrapper_path: "/usr/local/bin/newt-run"

newt_service_name: "newt"
newt_env_file: "/etc/default/newt"

newt_endpoint: ""
newt_id: ""
newt_secret: ""

# Pangolin blueprint config lives separately from env secrets to keep policy declarative.
newt_blueprint_path: "/etc/pangolin/blueprint.yaml"
newt_blueprint_template: "blueprint.yaml.j2"
newt_blueprint_mode: "full"
# Optional split blueprints. If `newt_blueprint` is unset, the role will select
# `newt_blueprint_auth_only` when `newt_blueprint_mode=auth-only`, otherwise
# it uses `newt_blueprint_full`.
newt_blueprint_auth_only: ~
newt_blueprint_full: ~
newt_blueprint: ~

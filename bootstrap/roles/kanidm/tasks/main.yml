---
- name: Capture Kanidm role path
  ansible.builtin.set_fact:
    kanidm_resolved_role_path: "{{ role_path }}"

- name: Deploy {{ kanidm_app_name }}
  ansible.builtin.include_role:
    name: docker_compose_app
  vars:
    app_name: "{{ kanidm_app_name }}"
    app_path: "{{ kanidm_app_path }}"
    src_role_path: "{{ kanidm_resolved_role_path }}"
    app_asset_dirs: "{{ kanidm_app_asset_dirs }}"
    app_asset_files: "{{ kanidm_app_asset_files }}"

---
- name: Assert required Newt configuration is provided
  ansible.builtin.assert:
    that:
      - (newt_id | length) > 0
      - (newt_secret | length) > 0
      - (newt_endpoint | length) > 0
    fail_msg: >-
      newt_id, newt_secret, and newt_endpoint must be set (preferably via Ansible Vault).

- name: Write Newt environment file
  ansible.builtin.copy:
    dest: "{{ newt_env_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      NEWT_ID={{ newt_id }}
      NEWT_SECRET={{ newt_secret }}
      NEWT_ENDPOINT={{ newt_endpoint }}
  notify: Restart newt

- name: Install Newt wrapper script
  ansible.builtin.copy:
    dest: "{{ newt_wrapper_path }}"
    owner: root
    group: root
    mode: "0700"
    content: |
      #!/bin/sh
      set -eu
      . {{ newt_env_file }}
      exec {{ newt_bin_path }} \
        --id "$NEWT_ID" \
        --secret "$NEWT_SECRET" \
        --endpoint "$NEWT_ENDPOINT"
  notify: Restart newt

- name: Install systemd unit for Newt
  ansible.builtin.template:
    src: "newt.service.j2"
    dest: "/etc/systemd/system/{{ newt_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart newt

- name: Enable and start Newt
  ansible.builtin.systemd:
    name: "{{ newt_service_name }}"
    enabled: true
    state: started


---
- name: Add ansible user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Write apps to variable
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files"
    file_type: directory
    pattern: newt
    depth: 1
  register: app_directories
  delegate_to: localhost
  become: false

- name: Write template files to variable
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/templates/newt/"
    patterns: "*.j2"
    recurse: false
    hidden: true
  register: template_files
  delegate_to: localhost
  become: false

- name: Create directory for apps
  ansible.builtin.file:
    path: "{{ apps_path }}"
    state: directory
    mode: "0755"

- name: Write app files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ item.path | basename }}/"
    dest: "{{ apps_path }}/{{ item.path | basename }}"
    mode: "0644"
  loop: "{{ app_directories.files }}"

- name: Write template files
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ apps_path }}/{{ item.path | regex_replace('^.*\/templates', '') | regex_replace('\\.j2$', '') }}"
    mode: "0600"
  loop: "{{ template_files.files }}"

- name: Docker Compose Up
  ansible.builtin.command: docker compose up -d
  become: true
  args:
    chdir: "{{ apps_path }}/{{ item.path | basename }}"
  loop: "{{ app_directories.files }}"


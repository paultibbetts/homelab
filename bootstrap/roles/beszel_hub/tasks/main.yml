---
- name: Add ansible user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  tags:
    - docker
    - docker_install

- name: Write apps to variable
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files"
    file_type: directory
    pattern: beszel_hub
    depth: 1
  register: app_directories
  delegate_to: localhost
  become: false

- name: Create directory for apps
  ansible.builtin.file:
    path: "{{ apps_path }}"
    state: directory
    mode: "0755"

- name: Write docker compose file
  ansible.builtin.copy:
    src: "docker-compose.yaml"
    dest: "{{ apps_path }}/beszel_hub/docker-compose.yaml"
    mode: "0644"

- name: Write env file
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ apps_path }}/beszel_hub/.env"
    mode: "0600"

- name: Docker Compose Up
  ansible.builtin.command: docker compose up -d
  become: true
  args:
    chdir: "{{ apps_path }}/{{ item.path | basename }}"
  loop: "{{ app_directories.files }}"
  tags:
    - docker


# https://www.beszel.dev/guide/advanced-deployment#installation-with-service-existing-check
---
- name: Download the install-agent.sh script
  get_url:
    url: https://get.beszel.dev
    dest: /tmp/install-agent.sh
    mode: '0755' # Set executable permissions

- name: Check if beszel-agent service exists and is active
  ansible.builtin.systemd:
    name: beszel-agent.service
  register: beszel_status
  failed_when: false
  changed_when: false

- name: Remove beszel agent if service exists
  become: true
  ansible.builtin.command:
    cmd: /tmp/install-agent.sh -u
  when: beszel_status.status.ActiveState == 'active'

- name: Run the install-agent.sh script with auto-update
  shell: yes | /tmp/install-agent.sh -p {{ beszel_agent_ssh_port }} -k "{{ beszel_agent_ssh_key }}"
  when: beszel_agent_autoupdate | bool
  ignore_errors: false

- name: Run the install-agent.sh script without auto-update
  shell: yes N | /tmp/install-agent.sh -p {{ beszel_agent_ssh_port }} -k "{{ beszel_agent_ssh_key }}"
  when: not beszel_agent_autoupdate | bool
  ignore_errors: false

- name: Register with hub
  block:
    - name: Write register with hub script
      ansible.builtin.template:
        src: "register-with-hub.js.j2"
        dest: "/tmp/beszel-register-agent-{{ inventory_hostname }}.js"

    - name: Register with hub
      ansible.builtin.command: "bun /tmp/beszel-register-agent-{{ inventory_hostname }}.js"

    - name: Cleanup
      ansible.builtin.file:
        path: "/tmp/beszel-register-agent-{{ inventory_hostname }}.js"
        state: "absent"
  delegate_to: localhost
  become: false

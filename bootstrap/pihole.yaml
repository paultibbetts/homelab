---
- hosts: pihole
  gather_facts: true
  become: true
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-pi-hole.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"
    healthcheck: "curl -fsS -m 10 --retry 5 -o /dev/null https://healthchecks.lab.paultibbetts.uk/ping/fda782cb-8301-4e53-801b-b8d5f7b114d9"
  tasks:
    - name: Configure backups
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: /var/backups/pi-hole
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/files/backups/{{ backup_script_name }}"
            dest: "{{ backup_script }}"
        - name: Make script executable
          ansible.builtin.file:
            path: "{{ backup_script }}"
            mode: "0755"
        - name: Add script to CRON
          ansible.builtin.cron:
            name: pi-hole backup
            hour: "4"
            minute: "0"
            job: "{{ backup_script }} && {{ healthcheck }}"
      

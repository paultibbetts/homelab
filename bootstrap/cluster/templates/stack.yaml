{{- range $index, $stack := .Values.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $stack.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '{{ default "0" $stack.wave }}'
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: {{ $.Values.gitops.repo }}
        revision: {{ $.Values.gitops.revision }}
        directories:
          - path: {{ $stack.name }}/*
{{- if eq $stack.name "platform" }}
          - path: platform/homepage
            exclude: true
{{- end }}
  template:
    metadata:
{{- if eq $stack.name "config" }}
      name: 'config-{{ `{{.path.basename}}` }}'
{{- else }}
      name: '{{ `{{.path.basename}}` }}'
{{- end }}
      labels:
        stack: {{ $stack.name }}
      annotations:
        argocd.argoproj.io/sync-wave: '{{ default "0" $stack.wave }}'
    spec:
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{ default `{{.path.basename}}` $stack.namespace }}'
      project: '{{ default "default" $stack.project }}'
      source:
        repoURL: {{ $.Values.gitops.repo }}
        path: '{{ `{{.path.path}}` }}'
        targetRevision: {{ $.Values.gitops.revision }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 1m
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[].apiVersion"
            - ".spec.volumeClaimTemplates[].kind"
{{- if eq $stack.name "apps" }}
  templatePatch: |
    {{ `{{- if eq .path.basename "plane" }}` }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[].apiVersion"
            - ".spec.volumeClaimTemplates[].kind"
        - group: batch
          kind: Job
          name: plane-api-migrate-1
          jqPathExpressions:
            - ".spec.selector"
            - ".spec.template"
        - group: batch
          kind: Job
          name: plane-minio-bucket-1
          jqPathExpressions:
            - ".spec.selector"
            - ".spec.template"
    {{ `{{- end }}` }}
    {{ `{{- if eq .path.basename "opengist" }}` }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[].apiVersion"
            - ".spec.volumeClaimTemplates[].kind"
            - ".spec.volumeClaimTemplates[].metadata.labels.\"helm.sh/chart\""
            - ".spec.volumeClaimTemplates[].metadata.labels.\"app.kubernetes.io/version\""
    {{ `{{- end }}` }}
{{- end }}
{{- end }}

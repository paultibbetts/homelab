---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: "!argocd"
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: "!argocd"
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: "!argocd"
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: homepage
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

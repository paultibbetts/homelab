services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:4f923bf0e9391b3a8bc5527e539b022e92dcc8a3a13e6ab66122ea9ed030e196
    container_name: homepage
    network_mode: host # uses port 3000, required for DNS
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.cloud.paultibbetts.uk # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hostsservices:
    env_file: .env

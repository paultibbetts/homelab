services:
  graphite-exporter-truenas:
    image: prom/graphite-exporter:v0.16.0
    container_name: graphite-exporter
    restart: always
    ports:
        - "9108:9108"
        - "9109:9109"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ./graphite_mapping.conf:/tmp/graphite_mapping.conf


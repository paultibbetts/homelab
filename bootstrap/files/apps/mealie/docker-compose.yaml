services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.6.1@sha256:e4690164cc4ed1bbd82adc00dd9aeed37bd49d938fe2f0ca46cb5082d05ddb71 #
    container_name: mealie
    restart: always
    ports:
        - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      #PUID: 1000
      #PGID: 1000
      TZ: Europe/London
      BASE_URL: https://mealie.cloud.paultibbetts.uk
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: 192.168.1.202
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      OIDC_AUTH_ENABLED: true
      OIDC_CONFIGURATION_URL: https://auth.cloud.paultibbetts.uk/oauth2/openid/mealie/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_NAME: "Kanidm"

volumes:
  mealie-data:

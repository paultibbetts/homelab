services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.3.1@sha256:a0d4a0b8543389ff3259eae40ffedeea94364f9229aa945a3e9d69e7a03e30ad # 
    container_name: mealie
    restart: always
    ports:
        - "9000:9000" # 
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - mealie-data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      #PUID: 1000
      #PGID: 1000
      TZ: Europe/London
      BASE_URL: https://mealie.cloud.paultibbetts.uk
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: 192.168.1.202
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      OIDC_AUTH_ENABLED: true
      OIDC_CONFIGURATION_URL: https://auth.lab.paultibbetts.uk/oauth2/openid/mealie/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_NAME: "Kanidm"

volumes:
  mealie-data:

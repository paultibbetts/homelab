services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: homebox
    restart: always
    environment:
    - HBOX_LOG_LEVEL=info
    - HBOX_LOG_FORMAT=text
    - HBOX_WEB_MAX_UPLOAD_SIZE=10
    - HBOX_OPTIONS_ALLOW_ANALYTICS=true
    # Database
    - HBOX_DATABASE_DRIVER=postgres
    - HBOX_DATABASE_HOST=postgres.infra.home.arpa
    - HBOX_DATABASE_PORT=5432
    - HBOX_DATABASE_USERNAME=homebox
    - HBOX_DATABASE_PASSWORD=${HBOX_DATABASE_PASSWORD}
    - HBOX_DATABASE_DATABASE=homebox
    # Storage
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - HBOX_STORAGE_CONN_STRING=s3://homebox?awssdk=v2&endpoint=http://192.168.1.4:9000&disable_https=true&s3ForcePathStyle=true
    # OIDC
    - HBOX_OPTIONS_HOSTNAME=homebox.cloud.paultibbetts.uk
    - HBOX_OIDC_ENABLED=true
    - HBOX_OIDC_ISSUER_URL=https://auth.cloud.paultibbetts.uk/oauth2/openid/homebox
    - HBOX_OIDC_CLIENT_ID=homebox
    - HBOX_OIDC_CLIENT_SECRET=${HBOX_OIDC_CLIENT_SECRET}
    - HBOX_OPTIONS_TRUST_PROXY=true
    volumes:
      - homebox-data:/data/
    ports:
      - 3100:7745

volumes:
   homebox-data:
     driver: local

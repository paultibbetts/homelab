services:
  ntfy:
    image: binwiederhier/ntfy@sha256:9114cd5cdcb8c2ea1239bd710caae867e82c2deda68271b9db151240b403b3f4
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: Europe/London
      # Reverse proxy
      NTFY_BASE_URL: https://ntfy.cloud.paultibbetts.uk
      NTFY_BEHIND_PROXY: true
      # Persistence
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # Auth
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: true
      # iOS
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      # Web Push
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: code@paultibbetts.uk
    env_file:
      - .env
    user: 1004:1004
    volumes:
      - ./data:/var/cache/ntfy
    ports:
      - 8093:80
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes

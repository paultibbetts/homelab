---
- hosts: apps
  vars:
    apps_path: /srv/www/apps
  tasks:
    - name: Install Docker
      ansible.builtin.import_role:
        name: geerlingguy.docker
      become: true

    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      become: true

    - name: Write apps to variable
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../files/apps"
        file_type: directory
        depth: 1
      register: app_directories
      delegate_to: localhost
      become: false

    - name: Find app env templates
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/apps"
        patterns: ".env.j2"
        recurse: true
        hidden: true
      register: env_template_files
      delegate_to: localhost
      become: false

    - name: Map app env templates
      ansible.builtin.set_fact:
        env_template_map: >-
          {{ env_template_map | default({}) | combine({ (item.path | dirname | basename): item.path }) }}
      loop: "{{ env_template_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"

    - name: Deploy compose apps
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/internal/common/tasks/deploy_compose_app.yml"
      vars:
        app_name: "{{ app_dir.path | basename }}"
        app_path: "{{ apps_path }}/{{ app_dir.path | basename }}"
        compose_src: "{{ playbook_dir }}/../files/apps/{{ app_dir.path | basename }}/docker-compose.yaml"
        app_user: "{{ ansible_user }}"
        env_template: >-
          {{ env_template_map[app_dir.path | basename]
             if env_template_map is defined and (app_dir.path | basename) in env_template_map else omit }}
      loop: "{{ app_directories.files }}"
      loop_control:
        loop_var: app_dir
        label: "{{ app_dir.path | basename }}"

    - name: Copy Homepage config directory
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/apps/homepage/config/"
        dest: "{{ apps_path }}/homepage/config/"
        owner: "{{ ops_user | default(ansible_facts['user_id']) }}"
        group: "{{ ops_user | default(ansible_facts['user_id']) }}"
        mode: "0644"
        directory_mode: "0755"
      when: "'homepage' in (app_directories.files | map(attribute='path') | map('basename') | list)"

---

- hosts: mysql
  gather_facts: true
  become: yes
  pre_tasks:
    - name: Update repositories cache
      ansible.builtin.apt:
        update_cache: yes
  roles:
    - role: geerlingguy.mysql
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-mysql.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"
  tasks:
    - name: Allow passwordless MySQL commands
      ansible.builtin.copy:
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ vault_mysql_root_password }}
    - name: Backup
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: /var/backups/mysql-dumps
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: "backups/{{ backup_script_name }}"
            dest: "{{ backup_script }}"
        - name: Make script executable
          ansible.builtin.file:
            path: "{{ backup_script }}"
            mode: "0755"
        - name: Add script to CRON
          ansible.builtin.cron:
            name: mysql backup
            hour: 5
            job: "{{ backup_script }}"

---
mysql_disable_log_bin: true

mysql_databases:
  - name: freshrss
  - name: gitea
  - name: uptime_monitor

mysql_users:
  - name: freshrss
    host: 192.168.1.%
    password: "{{ vault_freshrss_database_password }}"
    priv: "freshrss.*:ALL"
  - name: gitea
    host: 192.168.1.211
    password: "{{ vault_gitea_database_password }}"
    priv: "gitea.*:ALL"
  - name: uptime
    host: 192.168.1.%
    password: "{{ vault_uptime_database_password }}"
    priv: "uptime_monitor.*:SELECT"

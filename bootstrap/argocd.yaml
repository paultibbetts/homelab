---
- hosts: 127.0.0.1
  connection: local
  tasks:
    - name: Deploy ArgoCD helm chart
      kubernetes.core.helm:
        name: argocd
        chart_ref: ../cluster-bootstrap/argocd
        dependency_update: true
        release_namespace: argocd
        create_namespace: true
        values_files:
          - ../cluster-bootstrap/argocd/values-seed.yaml
      tags:
        - argocd
    - name: Deploy cluster helm chart
      kubernetes.core.helm:
        name: argocd
        chart_ref: ../cluster-bootstrap/cluster
        release_namespace: argocd
        values_files:
          - ../cluster-bootstrap/cluster/values-seed.yaml
      tags:
        - cluster

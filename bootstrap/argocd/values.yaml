dashboard:
  enabled: true

argo-cd:
  configs:
    cm:
      create: true
      oidc.config: |
        name: Kanidm
        issuer: https://auth.cloud.paultibbetts.uk/oauth2/openid/argocd
        clientID: argocd
        clientSecret: $argocd-sso-secret:oidc.clientSecret
        requestedIDTokenClaims:
          groups:
            essential: true
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        enablePKCEAuthentication: true
        enableUserInfoGroups: true
        userInfoPath: /userinfo
        userInfoCacheExpiration: "5m"
    params:
      reposerver.git.request.timeout: 60s
    rbac:
      create: true
      annotations: {}
      policy.default: ""
      # Policy rules are in the form:
      #  p, subject, resource, action, object, effect
      # Role definitions and bindings are in the form:
      #  g, subject, inherited-subject
      policy.csv: |
        g, argocd_admins, role:admin
      # -- OIDC scopes to examine during rbac enforcement (in addition to `sub` scope).
      # The scope value can be a string, or a list of strings.
      scopes: "[groups]"

      # -- Matcher function for Casbin, `glob` for glob matcher and `regex` for regex matcher.
      policy.matchMode: "glob"
  server:
    extraArgs:
      - --insecure
    config:
      statusbadge.enabled: "true"
    ingress:
      enabled: false
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: false
    resources:
      requests:
        memory: 128Mi
  dex:
    enabled: false
  controller:
    metrics: *metrics
    resources:
      requests:
        memory: 512Mi
  repoServer:
    metrics: *metrics
    resources:
      requests:
        memory: 256Mi
  redis:
    metrics: *metrics
    resources:
      requests:
        memory: 64Mi
  applicationSet:
    resources:
      requests:
        memory: 128Mi
  notifications:
    resources:
      requests:
        memory: 64Mi
  global:
    domain: argocd.lab.paultibbetts.uk
  certificate:
    enabled: true

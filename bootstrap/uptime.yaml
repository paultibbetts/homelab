---
- hosts: deskpi
  become: true
  vars:
    apps_path: /srv/www/apps
  tasks:
    - name: Install Docker
      ansible.builtin.import_role:
        name: geerlingguy.docker

    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Write apps to variable
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/files"
        file_type: directory
        pattern: uptime_kuma
        depth: 1
      register: app_directories
      delegate_to: localhost
      become: false

    - name: Create directory for apps
      ansible.builtin.file:
        path: "{{ apps_path }}"
        state: directory
        mode: "0755"

    - name: Write app files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/{{ item.path | basename }}/"
        dest: "{{ apps_path }}/{{ item.path | basename }}"
        mode: "0644"
      loop: "{{ app_directories.files }}"

    - name: Docker Compose Up
      ansible.builtin.command: docker compose up -d
      become: true
      args:
        chdir: "{{ apps_path }}/{{ item.path | basename }}"
      loop: "{{ app_directories.files }}"

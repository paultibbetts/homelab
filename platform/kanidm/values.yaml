# https://github.com/llajas/homelab/blob/6d74d1ddef078097fb2fa9ed03724eda9157c2f0/platform/kanidm/values.yaml
app-template:
  controllers:
    server:
      type: statefulset
      containers:
        server:
          image:
            repository: docker.io/kanidm/server
            tag: 1.6.4
      statefulset:
        volumeClaimTemplates:
          - name: data
            size: 1Gi
            globalMounts:
              - path: /data
            accessMode: "ReadWriteOnce"

          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5

  configMaps:
    config:
      enabled: true
      data:
        server.toml: |
          bindaddress = "[::]:443"
          ldapbindaddress = "[::]:636"
          trust_x_forward_for = true
          db_path = "/data/kanidm.db"
          tls_chain = "/data/ca.crt"
          tls_key = "/data/tls.key"
          domain = "auth.lab.paultibbetts.uk"
          origin = "https://auth.lab.paultibbetts.uk"
  service:
    server:
      controller: server
      ports:
        http:
          enabled: false
        https:
          port: 443
          protocol: HTTPS
        ldap:
          port: 636
          protocol: TCP
  ingress:
    server:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        nginx.ingress.kubernetes.io/backend-protocol: HTTPS
        external-dns.alpha.kubernetes.io/target: "traefik.lab.paultibbetts.uk"
        gethomepage.dev/href: "https://auth.lab.paultibbetts.uk"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Auth
        gethomepage.dev/group: Platform
        gethomepage.dev/icon: kanidm.png
        gethomepage.dev/name: Kanidm
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: &host auth.lab.paultibbetts.uk
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: server
                port: https
      tls:
        - hosts:
            - *host
          secretName: kanidm-tls-certificate
  persistence:
    config:
      enabled: true
      type: configMap
      name: kanidm-config
      globalMounts:
        - path: /data/server.toml
          subPath: server.toml
    tls:
      enabled: true
      type: secret
      name: kanidm-selfsigned-certificate
      globalMounts:
        - path: /data/ca.crt
          subPath: ca.crt
        - path: /data/tls.key
          subPath: tls.key

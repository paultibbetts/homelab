apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks
  namespace: healthchecks
  labels:
    app.kubernetes.io/name: healthchecks
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: healthchecks # has to match .spec.template.metadata.labels
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthchecks # has to match .spec.selector.matchLabels
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: healthchecks
          image: healthchecks/healthchecks:v5.0
          imagePullPolicy: Always
          env:
            - name: DB
              value: sqlite
            - name: DB_NAME
              value: /data/hc.sqlite
            - name: SITE_ROOT
              value: "https://healthchecks.lab.paultibbetts.uk"
            - name: INTEGRATIONS_ALLOW_PRIVATE_IPS
              value: "True"
            - name: DEBUG
              value: "False"
            - name: REGISTRATION_OPEN
              value: "False"
            - name: SITE_NAME
              value: Healthchecks
          envFrom:
            - secretRef:
                name: healthchecks-secret-env
          ports:
            - containerPort: 8000
              name: web
          startupProbe:
            httpGet:
              path: /health
              port: web
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: web
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: healthchecks-data
              mountPath: /data
      volumes:
        - name: healthchecks-data
          persistentVolumeClaim:
            claimName: healthchecks-data
